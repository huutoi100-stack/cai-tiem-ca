<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CÁI TIỆM CÁ · Menu cá cảnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#163d36; --ink2:#47665c; --deep:#286c58; --dark:#194d3e;
  --glass:linear-gradient(140deg,#ffffff94,#ffffff38);
  --edge:rgba(255,255,255,.8);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:#cbd7c5;
  position:fixed;inset:0;overflow-y:auto;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

/* ---------- bể kính phía sau ---------- */
.tank{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#c4d6bd}
.tank::before{content:"";position:absolute;inset:-28px;
  background:linear-gradient(180deg,#f3f8ed70,#e6f1de50 48%,#d5e4d63d),
    url("img/aquascape-background.jpg") 43% center/cover no-repeat;
  filter:blur(18px)}
.ray{position:absolute;top:-20vh;width:90px;height:130vh;opacity:.42;transform:rotate(17deg);
  background:radial-gradient(ellipse at 50% 12%,#fff,transparent 70%);transform-origin:top center}
.bubble{position:absolute;bottom:-30px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff 0 18%,rgba(255,255,255,.35) 40%,rgba(255,255,255,.08) 70%);
  border:1px solid rgba(255,255,255,.7);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}50%{transform:translate(12px,-55vh)}100%{transform:translate(-8px,-115vh);opacity:0}}

/* ---------- khung 1 màn hình ---------- */
.app{position:relative;z-index:1;max-width:440px;margin:0 auto;height:100dvh;min-height:620px;
  display:flex;flex-direction:column;gap:12px;
  padding:max(16px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
@media (max-width:519px){.app{overflow:hidden}}
@media (max-width:519px) and (max-height:740px){.app{min-height:740px}}
@media (min-width:520px){
  .app{margin:24px auto;height:calc(100dvh - 48px);border-radius:44px;border:1px solid var(--edge);
    background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.06));
    box-shadow:0 30px 80px rgba(30,70,120,.18),inset 0 1px 0 #fff;padding:22px 20px 16px}
}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:1px solid var(--edge);
  box-shadow:0 10px 28px rgba(30,70,120,.12),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35)}
.hand{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--deep)}

/* đầu trang */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand{font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:800;font-size:clamp(22px,6.5cqw,30px);line-height:1.05;margin:0;letter-spacing:-.3px;text-shadow:0 2px 0 rgba(255,255,255,.8)}
.sub{margin:3px 0 0;font-size:13px;color:var(--ink2)}
.image-credit{position:fixed;right:8px;bottom:2px;z-index:2;border:0;border-radius:5px;background:#f6fff1d9;padding:1px 5px;color:var(--deep);text-decoration:underline;cursor:pointer;font-size:10px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--deep);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 4px rgba(46,204,113,.18)}
.sec-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px}
.sec-row h2{white-space:nowrap;font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:800;font-size:clamp(14px,4.2cqw,18px);margin:0}
.sec-row .hand{white-space:nowrap;font-size:10px;font-weight:600}

/* ---------- xấp thẻ ---------- */
.deck{position:relative;flex:1;min-height:400px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card{position:absolute;top:0;bottom:0;left:24px;width:calc(100% - 48px);border-radius:34px;overflow:hidden;
  display:flex;flex-direction:column;cursor:grab;color:var(--ink);
  background:linear-gradient(145deg,#ffffffbd,#f3faef85 50%,#eaf4e966);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 22px 50px rgba(30,70,120,.22),inset 0 1px 0 #fff;
  transition:transform .2s ease-out,opacity .16s ease}
.card.front{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card.front:not(.promo){overflow:visible}
.card:not(.front){background:#eaf6e3b8}
.top,.sec-row{border-radius:18px;background:linear-gradient(125deg,#ffffffba,#f6f8ef78);padding:10px 12px;border:1px solid #fff9}
.sec-row{margin-top:0;padding:7px 12px}

.card.dragging{transition:none;cursor:grabbing}
.card:not(.front) *{animation-play-state:paused!important}
/* nền nước: dải sáng gợn sóng */
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    radial-gradient(130% 22% at 30% 24%,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(140% 20% at 70% 48%,rgba(255,255,255,.3),transparent 60%),
    radial-gradient(150% 18% at 40% 70%,rgba(255,255,255,.25),transparent 60%)}

.ph{position:relative;z-index:2;padding:14px 16px 0}
.meta{display:flex;justify-content:space-between;align-items:center}
.tier{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9)}
.tier i{width:7px;height:7px;border-radius:50%;background:#2ecc71}
.num{font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:700;font-size:14px;color:rgba(31,63,102,.45)}
.ph h3{margin:10px 0 0;font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:800;font-size:clamp(20px,6cqw,27px);line-height:1.1;text-transform:uppercase;letter-spacing:.15px;color:var(--ink)}
.lead{margin:6px 0 0;font-size:12px;line-height:1.45;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.hero{position:relative;z-index:1;flex:1;min-height:120px;display:grid;place-items:center}
.hero::after{content:"";position:absolute;left:28%;right:28%;bottom:4%;height:14px;border-radius:50%;
  background:radial-gradient(ellipse,#1f3f6630,transparent 70%)}
.hero .cut{position:absolute;width:83%;height:85%;object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 14px 14px rgba(31,63,102,.28))}
.front .hero .cut{left:-5%;width:122%;height:89%;filter:drop-shadow(0 16px 12px #1f3f6659)}
.cut[data-src]:not([src]){visibility:hidden}
.cut[data-face="left"]{scale:-1 1}
.front img.is-swimming{opacity:0;transition:none}
.front .hero .swim-frame{z-index:4;filter:none;pointer-events:none;transition:none}
.front .hero .shrimp,.front .mt .shrimp{animation:shrimpHover 3.6s ease-in-out infinite}
.front .hero .crab,.front .mt .crab{animation:photoScuttle 4.3s ease-in-out infinite}
@keyframes shrimpHover{
  0%,100%{transform:translate(-1%,1%) rotate(-1deg)}
  50%{transform:translate(1%,-1%) rotate(1deg)}
}
@keyframes photoScuttle{
  0%,100%{transform:translateX(-2%)}
  36%,62%{transform:translateX(2%)}
}
.hero .fishbox{width:84%}
.front .hero .fishbox{width:114%}
.card:not(.front) .hero>*{transform:translateX(-30px);opacity:.7;transition:transform .18s,opacity .12s}
.front .hero>*{transition:transform .18s ease-out,opacity .12s}
.bb{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 32% 30%,#fff 0 16%,rgba(255,255,255,.45) 36%,rgba(160,200,240,.25) 70%);
  border:1px solid rgba(255,255,255,.85);box-shadow:inset -2px -2px 4px #5082be30}

.pf{position:relative;z-index:2;padding:0 12px 12px;display:flex;flex-direction:column;gap:7px}
.stats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.stock-badge{display:inline-flex;align-self:center;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:750;color:#15594b;background:#d9f4ea}
.stock-badge.low-stock{color:#704516;background:#fff0ca}
.stock-badge.out-of-stock{color:#8a3140;background:#ffe4e8}
.stat{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:12px;font-size:11px;font-weight:600;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9)}
.dots5{display:flex;gap:2px}.dots5 i{width:8px;height:5px;border-radius:3px;background:rgba(31,63,102,.15)}
.dots5 i.on{background:linear-gradient(90deg,#6aa9ec,#2c6db5)}
.swipe{text-align:center;font-size:11.5px;font-weight:600;color:#2b5a8c;letter-spacing:.3px}

/* Combo */
.deck.is-combo .card{width:calc(100% - 48px)}
.promo{color:var(--ink);border-color:#fffe;
  background:radial-gradient(ellipse at 2% 7%,#cff0dca6,transparent 58%),
    radial-gradient(ellipse at 97% 65%,#f5e3b680,transparent 55%),
    linear-gradient(145deg,#ffffffbd,#eff9ea80 52%,#e6dcf670);
  box-shadow:0 16px 35px #102e3433,inset 0 1px 0 #fff,inset 0 -1px 0 #fff9}
.promo::before{background:linear-gradient(125deg,#ffffff66,transparent 42%,#ffffff18 60%,transparent)}
.promo .ph{padding:12px 12px 6px;text-align:center}
.promo .ph h3{color:var(--ink);font-size:clamp(21px,6.2cqw,29px);margin-top:7px}
.combo-price{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;
  min-width:min(100%,178px);max-width:100%;padding:5px 13px 6px;border-radius:16px;
  border-color:#fffd;background:linear-gradient(145deg,#fff9,#fff2 66%,#c8f5fa61);color:var(--ink);
  box-shadow:inset 0 1px 0 #ffff,0 5px 12px #27627b26}
.combo-price::before{content:"";position:absolute;pointer-events:none;left:-23px;top:1px;width:20px;height:40px;
  background:
    radial-gradient(circle at 36% 24%,#fffc 0 2px,#d7f8ff80 3px 5px,#fff9 5.5px 6px,transparent 6.5px) 0 0/16px 18px no-repeat,
    radial-gradient(circle at 55% 55%,#fffc 0 1px,#baf3ff52 2px 3px,#fff9 3.5px 4px,transparent 4.5px) 8px 19px/12px 14px no-repeat}
.combo-price::after{content:"";position:absolute;right:-22px;bottom:3px;width:14px;height:24px;
  border-radius:80% 5% 75% 5%;background:linear-gradient(135deg,#d4edb8,#64a876);border:1px solid #fff9;transform:rotate(24deg)}
.combo-price strong{font:800 clamp(28px,8.4cqw,38px)/1 'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);letter-spacing:-.5px}
.combo-price .price-label{color:var(--ink2);font-size:11px;font-weight:600;line-height:1.2}
.retail{position:absolute;z-index:3;top:16px;left:14px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;color:var(--ink);
  font:800 clamp(26px,8cqw,34px)/1 'Be Vietnam Pro',system-ui,sans-serif;letter-spacing:-.5px;text-shadow:0 2px 0 #fff9}
.retail .rmain{display:flex;align-items:baseline;gap:3px}
.retail small{font:700 13px/1 'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink)}
.packs{display:flex;justify-content:center;gap:7px}
.packs .combo-price{flex:1 1 0;min-width:0;max-width:190px;padding:5px 4px 6px;text-align:center}
.packs .combo-price span{white-space:nowrap}
.packs:not(.n1) .combo-price span{font-size:9.5px;letter-spacing:-.1px}
.packs .combo-price::before,.packs .combo-price::after{content:none}
.packs:not(.n1) .combo-price strong{font-size:clamp(20px,6.4cqw,28px)}
.minis{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;
  overflow-y:auto;overscroll-behavior-y:contain;gap:5px;padding:4px 12px;scrollbar-width:thin}
.mini{flex:1 0 54px;min-width:0;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:9px;
  padding:2px 10px;border-radius:16px;box-shadow:inset 0 1px 0 #fffd,0 2px 5px #28627a1a}
.mini.glass{-webkit-backdrop-filter:none;backdrop-filter:none}
.mini:nth-child(even){grid-template-columns:1fr 1.15fr;text-align:right}
.mini:nth-child(even) .mt{grid-column:2;grid-row:1}
.mini:nth-child(even) .mini-info{grid-column:1;grid-row:1}
.mini-info{position:relative;z-index:1;min-width:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:clamp(12px,3.7cqw,16px);
  font-weight:800;line-height:1.12;text-transform:uppercase;overflow-wrap:anywhere;color:var(--ink)}
.mt{position:relative;z-index:3;overflow:visible;height:46px;display:grid;grid-template-rows:minmax(0,1fr);place-items:center;min-width:0}
.mt img{width:100%;height:100%;min-height:0;object-fit:contain}
.mt img{filter:drop-shadow(0 5px 5px #194d6b56)}
.mt .swim-frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mini strong{display:block;margin-top:3px;color:var(--ink);font:700 11px/1.2 'Be Vietnam Pro',system-ui,sans-serif;text-transform:none}
.promo .pf{gap:4px;padding:7px 12px 12px;text-align:center;background:linear-gradient(transparent,#f1f7ed91)}
.benefit{margin:0;color:var(--ink);font-size:11px;line-height:1.32}
.benefit b{display:block;color:#14545b;font-size:13px;margin-bottom:2px}
.promo .gift,.combo-count{color:#28515d;font-size:10.5px;margin:0}
.promo-grid .minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(5,minmax(0,1fr));overflow:hidden;gap:5px;padding:4px 10px}
.promo-grid .mini{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;
  min-height:0;gap:1px;padding:2px 4px 4px;border-radius:12px;text-align:center}
.promo-grid .mini .mt{grid-column:1;grid-row:1;height:100%;min-height:0}
.promo-grid .mini .mini-info{grid-column:1;grid-row:2;font-size:clamp(10px,3.1cqw,13px)}
.promo-grid .mt svg{transform:scale(2.1)}
.promo .combo-scroll{margin:3px 0 0;font-size:10px;font-weight:700;color:#28515d}

.fishbox svg,.mt svg{width:100%;height:auto;display:block;overflow:visible}
.mt svg{max-height:100%;transform:scale(2.1)}
.swim{animation:swim 4.2s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translate(-8px,2px) rotate(-2deg)}50%{transform:translate(10px,-7px) rotate(2deg)}}
.walk{animation:walk 3.4s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateX(-12px)}50%{transform:translateX(12px)}}
.tail{animation:tail .45s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-13deg) scaleX(.92)}to{transform:rotate(13deg) scaleX(1.04)}}
.pfin{animation:pfin .5s ease-in-out infinite alternate}
@keyframes pfin{from{transform:rotate(-20deg)}to{transform:rotate(25deg)}}
.topfin{animation:topfin 1.2s ease-in-out infinite alternate}
@keyframes topfin{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}
.ant,.whisk{animation:ant 1.4s ease-in-out infinite alternate}
@keyframes ant{from{transform:rotate(-7deg)}to{transform:rotate(6deg)}}
.legs{animation:legs .32s ease-in-out infinite alternate}
@keyframes legs{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
.claw{animation:claw .9s ease-in-out infinite alternate}
@keyframes claw{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}

/* điều khiển */
.ctrl{display:flex;align-items:center;justify-content:center;gap:12px}
.ctrl button{width:44px;height:44px;background:#f4fff7eb;color:#174f3d;border:1px solid #fff;box-shadow:0 3px 9px #102c3540;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0}
.ctrl button:disabled{opacity:.55;cursor:default}
.pager{display:flex;gap:5px;align-items:center}
.pager i{width:6px;height:6px;border-radius:4px;background:#f5fff1d9;box-shadow:0 0 0 1px #224d4266;transition:width .15s,background .15s}
.pager i.on{width:18px;background:var(--deep)}

/* thanh nhóm dưới cùng */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;border-radius:24px}
.tabs button{border:0;background:none;padding:7px 2px 6px;border-radius:19px;cursor:pointer;
  font-size:11.5px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .3s,color .3s}
.tabs button span{font-size:18px;line-height:1}
.tabs button.on{background:#fff;color:var(--deep);box-shadow:0 4px 12px rgba(30,70,120,.15)}

dialog{max-width:400px;width:calc(100% - 32px);border:1px solid #fff;border-radius:24px;padding:18px;color:var(--ink);
  background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
dialog::backdrop{background:rgba(17,58,56,.25)}
dialog h3{margin:0 0 8px;font-family:'Be Vietnam Pro',system-ui,sans-serif}
dialog ul{margin:0;padding-left:18px;font-size:12px;line-height:1.6;max-height:50vh;overflow:auto}
dialog a{color:var(--deep)}
dialog form{text-align:right;margin-top:10px}
dialog button{border:0;background:var(--dark);color:#fff;padding:8px 16px;border-radius:999px;cursor:pointer}

.paused *, .paused *::before, .paused *::after{animation-play-state:paused!important}
/* Keep the same portrait composition; fit it inside the available viewport. */
html,body{overflow:hidden;touch-action:pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.app{position:absolute;left:50%;top:50%;width:430px;max-width:none;height:850px;min-height:0;
  margin:0;padding:16px 16px 12px;overflow:hidden;border:0;border-radius:0;
  background:none;box-shadow:none;container-type:inline-size;
  transform:translate(-50%,-50%) scale(var(--menu-scale,1));transform-origin:center}
.deck{min-height:0;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 18px,#000 calc(100% - 18px),transparent);
  mask-image:linear-gradient(to right,transparent,#000 18px,#000 calc(100% - 18px),transparent)}
.app button{touch-action:manipulation}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="tank" aria-hidden="true">
  <div class="ray" style="left:8%"></div>
  <div class="ray" style="left:46%;animation-delay:-3s;width:60px"></div>
  <div class="ray" style="left:78%;animation-delay:-6s"></div>
</div>

<main class="app">
  <header class="top">
    <div>
      <h1 class="brand">CÁI TIỆM CÁ</h1>
      <p class="sub">CÁ CẢNH · THỦY SINH · TÉP · CUA</p>
    </div>
    <div class="pill glass"><i></i>Đang mở cửa</div>
  </header>

  <div class="sec-row"><h2 id="secTitle"></h2><span class="hand">vuốt để xem →</span></div>

  <section class="deck" id="deck" aria-roledescription="carousel" aria-live="polite"></section>

  <div class="ctrl">
    <button class="glass" id="prev" aria-label="Thẻ trước"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 3 5 8l5 5"/></svg></button>
    <div class="pager" id="pager"></div>
    <button class="glass" id="next" aria-label="Thẻ sau"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 3 5 5-5 5"/></svg></button>
  </div>

  <nav class="tabs glass" id="tabs" aria-label="Nhóm sản phẩm"></nav>
</main>
<button class="image-credit" type="button" id="creditBtn">nguồn ảnh</button>

<dialog id="credits">
  <h3>Nguồn ảnh</h3>
  <ul id="creditList"></ul>
  <form method="dialog"><button>Đóng</button></form>
</dialog>

<script>
/* ============================================================
   MENU — sửa ở đây.
   gia: giá lẻ 1 con.  deals: [số lượng, giá].  img: ảnh thật (bỏ trống = hình vẽ).
   khoe / de: điểm 1–5 (độ khỏe, độ dễ nuôi).
   ============================================================ */
const SECTIONS = [
  {id:"combo", tab:"Combo", icon:"🎁", ten:"COMBO GIÁ SIÊU HỜI"},
  {id:"giua",  tab:"Tầng giữa", icon:"🐠", ten:"CÁ TẦNG GIỮA"},
  {id:"day",   tab:"Tầng đáy",  icon:"🪨", ten:"CÁ TẦNG ĐÁY"},
  {id:"tep",   tab:"Tép & Cua", icon:"🦐", ten:"TÉP & CUA"},
];

const ITEMS = [

let uid = 0;
const art = L => { const id = "a" + (uid++);
  return L.kind==="shrimp" ? shrimpSVG(L,id) : L.kind==="crab" ? crabSVG(L,id) : fishSVG(L,id); };

function fishSVG(L, id){

/* ================= xấp thẻ vuốt ================= */
const deck=document.getElementById("deck"), pager=document.getElementById("pager");
const prevB=document.getElementById("prev"), nextB=document.getElementById("next");
let cards=[], idx=0;

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
let swimmingCard = null, swimmers = [], swimRequest = 0, lastSwimDraw = 0;

// The wave gains amplitude toward the tail while the head stays steady.
function bodyWave(distance, phase, width){
  return width * .035 * distance ** 2 * Math.sin(phase - distance * 2.8);
}

function drawFish({photo, swimFrame, swimContext, phaseOffset}, now){
  if (!photo.complete || !photo.naturalWidth) return;
  const compact = photo.closest(".mt") !== null;
  const ratio = Math.min(window.devicePixelRatio || 1, compact ? 2 : 1.5);
  const displayWidth = photo.clientWidth;
  const displayHeight = photo.clientHeight;
  const padding = compact ? Math.ceil(displayWidth * .06) : 0;
  const width = Math.round((displayWidth + padding * 2) * ratio);
  const height = Math.round((displayHeight + padding * 2) * ratio);
  if (compact) {
    swimFrame.style.inset = "auto";
    swimFrame.style.width = `${displayWidth + padding * 2}px`;
    swimFrame.style.height = `${displayHeight + padding * 2}px`;
    swimFrame.style.left = `${-padding}px`;
    swimFrame.style.top = `${-padding}px`;
  }
  if (width && height) {
    if (swimFrame.width !== width) swimFrame.width = width;
    if (swimFrame.height !== height) swimFrame.height = height;
    const [cropX,cropY,cropWidth,cropHeight] = compact
      ? PHOTO_BOUNDS[photo.dataset.src] || [0,0,photo.naturalWidth,photo.naturalHeight]
      : [0,0,photo.naturalWidth,photo.naturalHeight];
    const scale = compact ? Math.min(displayWidth * ratio * .98 / cropWidth, displayHeight * ratio / cropHeight)
      : Math.min(width * .96 / cropWidth, height * .94 / cropHeight);
    const fishWidth = cropWidth * scale;
    const fishHeight = cropHeight * scale;
    const time = now / 1000 + phaseOffset;
    const phase = time * 6.5 + Math.sin(time * 1.6) * .55;
    const x = (width - fishWidth) / 2 + Math.sin(time * 1.5) * width * .012;
    const y = (height - fishHeight) / 2 + Math.sin(time * 2.1) * height * .008;
    const facesRight = photo.dataset.face === "right";
    const direction = facesRight ? 1 : -1;
    const strips = compact ? 10 : 16;
    const slice = fishWidth / strips;

    swimContext.setTransform(1, 0, 0, 1, 0, 0);
    swimContext.clearRect(0, 0, width, height);
    swimContext.imageSmoothingQuality = "high";
    for (let i = 0; i < strips; i++) {
      const start = facesRight ? 1 - i / strips : i / strips;
      const end = facesRight ? start - 1 / strips : start + 1 / strips;
      const offset = bodyWave(start, phase, fishWidth);
      const slope = (bodyWave(end, phase, fishWidth) - offset) / slice;
      const sourceX = cropX + i * cropWidth / strips;
      const sourceWidth = Math.min(cropX + cropWidth - sourceX, (slice + .6) / scale);
      const originalX = x + i * slice;
      const screenX = facesRight ? originalX : width - originalX;
      swimContext.setTransform(direction, slope, 0, 1, screenX, y + offset);
      swimContext.drawImage(photo, sourceX, cropY, sourceWidth, cropHeight,
        0, 0, sourceWidth * scale, fishHeight);
    }
    if (!swimFrame.isConnected) {
      photo.after(swimFrame);
      photo.classList.add("is-swimming");
    }
  }
}

function drawSwim(now){
  const interval = 1000 / 24;
  const elapsed = now - lastSwimDraw;
  if (elapsed >= interval) {
    lastSwimDraw = now - elapsed % interval;
    for (const swimmer of swimmers) drawFish(swimmer, now);
  }
  swimRequest = requestAnimationFrame(drawSwim);
}

function updateSwimmer(){
  const card = reducedMotion.matches || document.hidden ? null : cards[idx];
  if (card === swimmingCard) return;
  cancelAnimationFrame(swimRequest);
  for (const {photo, swimFrame} of swimmers) {
    photo.classList.remove("is-swimming");
    swimFrame.remove();
  }
  swimmingCard = card;
  swimmers = [];
  card?.querySelectorAll("img.fish").forEach((photo, i) => {
    const swimFrame = document.createElement("canvas");
    swimFrame.className = "cut swim-frame";
    swimFrame.setAttribute("aria-hidden", "true");
    const swimContext = swimFrame.getContext("2d");
    if (swimContext) swimmers.push({photo, swimFrame, swimContext, phaseOffset: i * .41});
  });
  if (swimmers.length) swimRequest = requestAnimationFrame(drawSwim);
}
reducedMotion.addEventListener("change", updateSwimmer);
document.addEventListener("visibilitychange", () => {
  document.documentElement.classList.toggle("paused", document.hidden);
  updateSwimmer();
});

function relativeCard(j, selected, count){
  let distance=(j-selected+count)%count;
  if(distance>count/2) distance-=count;
  return distance;
}

function layout(dx=0){
  const spacing=(deck.clientWidth-48)*.88;
  cards.forEach((c,j)=>{
    const k=relativeCard(j,idx,cards.length);
    const visible=Math.abs(k)<=1;
    const shift=k===0 ? dx : k*spacing+dx*.2;
    c.style.transform=`translateX(${shift}px) scale(${k===0 ? 1 : .84})`;
    c.style.opacity=visible ? (k===0 ? "1" : ".82") : "0";
    c.style.visibility=visible ? "visible" : "hidden";
    c.style.zIndex=k===0 ? "3" : "1";
    c.classList.toggle("front",k===0);
    c.inert=k!==0;
    if(visible && !c.dataset.photosLoaded){
      for(const photo of c.querySelectorAll("img[data-src]")) photo.src=photo.dataset.src;
      c.dataset.photosLoaded="true";
    }
  });
  pager.innerHTML=cards.map((_,j)=>`<i class="${j===idx?'on':''}"></i>`).join("");
  prevB.disabled=nextB.disabled=cards.length<=1;
  updateSwimmer();
}
const go = n => {
  if(!cards.length) return;
  resetDrag();
  idx=(n%cards.length+cards.length)%cards.length;
  layout();
};
function fitMenu(){
  const viewport=window.visualViewport;
  const width=viewport?.width || innerWidth, height=viewport?.height || innerHeight;
  document.documentElement.style.setProperty("--menu-scale",Math.min(width/430,height/850,1));
  resetDrag(); layout();
}
addEventListener("resize",fitMenu);
window.visualViewport?.addEventListener("resize",fitMenu);
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("touchmove",e=>{
  if(e.touches.length>1 && e.cancelable) e.preventDefault();
},{passive:false});
document.addEventListener("dblclick",e=>{
  if(e.target.closest(".app")) e.preventDefault();
});

function show(sec){
  resetDrag();
  const s=SECTIONS.find(x=>x.id===sec);
  deck.classList.toggle("is-combo", sec==="combo");
  document.getElementById("secTitle").textContent=s.ten;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.id===sec));
  deck.innerHTML = sec==="combo" ? COMBOS.map(comboCard).join("")
    : ITEMS.filter(x=>x.sec===sec).map(itemCard).join("");
  cards=[...deck.children]; idx=0; layout();
}

// kéo/vuốt thẻ trên cùng
let sx=null, sy=0, dx=0, dragPointer=null, suppressClick=false;
function resetDrag(){
  cards[idx]?.classList.remove("dragging");
  sx=null; dx=0; dragPointer=null;
}
function cancelDrag(){
  if(sx===null) return;
  resetDrag(); layout();
}
deck.addEventListener("pointerdown",e=>{
  suppressClick=false;
  if(e.isPrimary===false || e.button!==0) return;
  const c=cards[idx]; if(!c || !c.contains(e.target)) return;
  sx=e.clientX; sy=e.clientY; dx=0; dragPointer=e.pointerId;
  deck.setPointerCapture(e.pointerId);
});
deck.addEventListener("pointermove",e=>{
  if(sx===null || e.pointerId!==dragPointer) return;
  const horizontal=e.clientX-sx, vertical=e.clientY-sy;
  if(!suppressClick && Math.abs(vertical)>Math.max(8,Math.abs(horizontal))){cancelDrag();return;}
  if(Math.abs(horizontal)>8){
    suppressClick=true;
    if(e.cancelable) e.preventDefault();
    const scale=deck.getBoundingClientRect().width/deck.clientWidth;
    const limit=deck.clientWidth*.35;
    dx=Math.max(-limit,Math.min(limit,horizontal/scale));
    cards[idx].classList.add("dragging"); layout(dx);
  }
});
const end=e=>{
  if(sx===null || e.pointerId!==dragPointer) return;
  const distance=dx; resetDrag();
  if(distance<-60) go(idx+1); else if(distance>60) go(idx-1); else layout();
};
deck.addEventListener("pointerup",end);
deck.addEventListener("pointercancel",cancelDrag);
deck.addEventListener("lostpointercapture",cancelDrag);
// iOS in-app browsers can start native scrolling despite pointer capture.
deck.addEventListener("touchmove",e=>{
  if(sx!==null && suppressClick && e.cancelable) e.preventDefault();
},{passive:false});
addEventListener("blur",cancelDrag);
document.addEventListener("visibilitychange",cancelDrag);
// bấm vào thẻ đang ló phía sau để xem tiếp
deck.addEventListener("click",e=>{
  if(suppressClick){suppressClick=false;return;}
  if(!cards[idx]) return;
  const bounds=cards[idx].getBoundingClientRect();
  if(e.clientX<bounds.left) go(idx-1);
  else if(e.clientX>bounds.right) go(idx+1);
});
prevB.onclick=()=>go(idx-1); nextB.onclick=()=>go(idx+1);
addEventListener("keydown",e=>{ if(e.key==="ArrowRight") go(idx+1); if(e.key==="ArrowLeft") go(idx-1); });

document.getElementById("tabs").innerHTML = SECTIONS.map(s=>`<button type="button" data-id="${s.id}"><span>${s.icon}</span>${s.tab}</button>`).join("");
document.getElementById("tabs").onclick=e=>{ const b=e.target.closest("button"); if(b) show(b.dataset.id); };

document.getElementById("creditList").innerHTML = CREDITS.map(([t,a,l,u])=>`<li>${t}: <a href="${u}" target="_blank" rel="noopener">${a||"Wikimedia Commons"}</a>${l ? `, ${l}` : ""}</li>`).join("")
  + "<li>Ảnh tham chiếu từ các nguồn trên đã được tách nền. Các mục chưa có ảnh dùng hình vẽ.</li>";
document.getElementById("creditBtn").onclick=()=>document.getElementById("credits").showModal();

show("combo");
fitMenu();

/* bong bóng */
const tank=document.querySelector(".tank");
for(let i=0;i<5;i++){
  const b=document.createElement("span"), d=6+Math.random()*16;
  b.className="bubble";
  b.style.cssText=`left:${Math.random()*100}%;width:${d}px;height:${d}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*18}s`;
  tank.appendChild(b);
}
</script>
</body>
